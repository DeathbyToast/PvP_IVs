ref="/contact.html">Contact Us</a><a href="/privacy.html">Privacy Policy</a><a href="/cookies.html">Cookie Policy</a></div></li></ul></header><br /><section id="analyzerBox"><h2>Bottle Cap Analyzer</h2><p>Find the best IVs for a Pokémon by simulating Silver and Gold Bottle Caps.</p><div><label for="pokeList">1. Pokémon:</label><input id="pokeList" onfocus="this.value=''" placeholder="e.g. Snorlax"/></div><div><label>2. Current IVs (Floor):</label><input type="number" id="floorA" value="2" min="0" max="15" title="Current Attack IV"> / <input type="number" id="floorD" value="5" min="0" max="15" title="Current Defense IV"> / <input type="number" id="floorS" value="7" min="0" max="15" title="Current Stamina IV"></div><div><button id="goButton" onclick="analyzeBottleCaps()">3. Analyze</button></div><div id="feedback" style="margin-top: 15px;"></div><div id="results" style="margin-top: 15px;"></div></section><script async defer src="https://pvpivs.com/includes/darkLightThemes.js"></script><script src="https://pvpivs.com/includes/calculate.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script><script> var v = "14"; // This version is from your live site document.write('<script src="https://pvpivs.com/includes/pokeListObj-' + v + '.js"><\/script>'); </script><script> var inputMon = ""; // Store selected Pokémon var input = document.getElementById("pokeList"); var monNames = []; // Will be populated after pokeListObj loads // We must wait for pokeListObj to load, as it's now dynamic function initializeAwesomplete() { // Check if pokeListObj has loaded if (typeof pokeListObj !== 'undefined' && Object.keys(pokeListObj).length > 1000) { monNames = Object.keys(pokeListObj); new Awesomplete(input, {list: monNames}); Awesomplete.$.bind(input, { "awesomplete-selectcomplete": function(evt) { inputMon = evt.text.label; } }); // Also handle manual input verification input.addEventListener('input', function() { if (monNames.includes(this.value)) { inputMon = this.value; } else { inputMon = ""; // Clear if not a valid mon } }); } else if (document.getElementById('feedback').innerHTML.indexOf('ERROR') === -1) { // pokeListObj not ready, try again setTimeout(initializeAwesomplete, 100); } } // Start the checker initializeAwesomplete(); /** * Main analysis function * (BUG FIX 2: This function is now defined correctly * because the script no longer halts on the pokeListObj error) */ function analyzeBottleCaps() { // Clear previous results document.getElementById('feedback').innerHTML = "<i>Calculating... (This may take a moment)</i>"; document.getElementById('results').innerHTML = ""; // --- 1. Get User Inputs --- let floorA = parseInt(document.getElementById('floorA').value); let floorD = parseInt(document.getElementById('floorD').value); let floorS = parseInt(document.getElementById('floorS').value); if (inputMon === "" || !pokeListObj[inputMon]) { document.getElementById('feedback').innerHTML = "<p style='color: var(--badResult);'>Please select a valid Pokémon.</p>"; return; } if (isNaN(floorA) || isNaN(floorD) || isNaN(floorS) || floorA < 0 || floorA > 15 || floorD < 0 || floorD > 15 || floorS < 0 || floorS > 15) { document.getElementById('feedback').innerHTML = "<p style='color: var(--badResult);'>Please enter valid current IVs (0-15).</p>"; return; } let baseStats = pokeListObj[inputMon].split(','); let bAtk = parseInt(baseStats[1]); let bDef = parseInt(baseStats[2]); let bSta = parseInt(baseStats[3]); let leagues = [ { name: "Little League", cp: 500 }, { name: "Great League", cp: 1500 }, { name: "Ultra League", cp: 2500 }, { name: "Master League", cp: "ML" } ]; let resultsHTML = ""; // --- 2. Loop through each league --- // We run this in a setTimeout to allow the "Calculating..." message to render setTimeout(function() { for (let league of leagues) { // Get the full ranking data for this Pokémon and league // We use floor 0 to get all 4096 combos let ranks = calculate(bAtk, bDef, bSta, 0, 1, 51, false, league.cp, inputMon); let keys = Object.keys(ranks); // keys are "StatProd.Lvl.A.D.S" let totalRanks = ranks.numRanks; // Find the original rank let originalRank = 4097; let originalIVSuffix = `.${floorA}.${floorD}.${floorS}`; let originalKey = keys.find(k => k.endsWith(originalIVSuffix)); if (originalKey) { originalRank = ranks[originalKey][0]; } resultsHTML += `<div class="league-result"><h3>${league.name} (${league.cp} CP)</h3>`; resultsHTML += `<p class="original-rank">Original Rank (${floorA}/${floorD}/${floorS}): <b>#${originalRank}</b> / ${totalRanks}</p>`; // --- 3. Silver Cap Analysis --- let bestSilverRank = originalRank; let bestSilverIVs = `${floorA}/${floorD}/${floorS}`; let bestSilverKey = originalKey; // Test Silver A (from floorA UP TO 15) for (let a = floorA; a <= 15; a++) { let key = keys.find(k => k.endsWith(`.${a}.${floorD}.${floorS}`)); if (key && ranks[key][0] < bestSilverRank) { bestSilverRank = ranks[key][0]; bestSilverIVs = `${a}/${floorD}/${floorS}`; bestSilverKey = key; } } // Test Silver D (from floorD UP TO 15) for (let d = floorD; d <= 15; d++) { let key = keys.find(k => k.endsWith(`.${floorA}.${d}.${floorS}`)); if (key && ranks[key][0] < bestSilverRank) { bestSilverRank = ranks[key][0]; bestSilverIVs = `${floorA}/${d}/${floorS}`; bestSilverKey = key; } } // Test Silver S (from floorS UP TO 15) for (let s = floorS; s <= 15; s++) { let key = keys.find(k => k.endsWith(`.${floorA}.${floorD}.${s}`)); if (key && ranks[key][0] < bestSilverRank) { bestSilverRank = ranks[key][0]; bestSilverIVs = `${floorA}/${floorD}/${s}`; bestSilverKey = key; } } // --- 4. Gold Cap Analysis --- // (Finds the best rank by incrementing *any/all* IVs from their floor) let bestGoldRank = bestSilverRank; // Gold must be at least as good as Silver let bestGoldIVs = bestSilverIVs; let bestGoldKey = bestSilverKey; for (let a = floorA; a <= 15; a++) { for (let d = floorD; d <= 15; d++) { for (let s = floorS; s <= 15; s++) { // This covers all combos: A/D/S, A/D, A/S, D/S, A, D, S, and original let key = keys.find(k => k.endsWith(`.${a}.${d}.${s}`)); if (key && ranks[key][0] < bestGoldRank) { bestGoldRank = ranks[key][0]; bestGoldIVs = `${a}/${d}/${s}`; bestGoldKey = key; } } } } // --- 5. Format Output --- // Silver resultsHTML += `<h4>Best Silver Cap Result:</h4>`; if (bestSilverKey) { let rankData = ranks[bestSilverKey]; let level = bestSilverKey.split('.')[1]; resultsHTML += ` <p>Rank: <b class="best-rank">#${bestSilverRank}</b> / ${totalRanks}</p><p>IVs: <b>${bestSilverIVs}</b> (Lvl ${level})</p><p>Stats: ${rankData[1].toFixed(2)} Atk / ${rankData[2].toFixed(2)} Def / ${rankData[3]} HP</p> `; } else { resultsHTML += `<p>No valid rank found (Pokémon may be too high CP for this league).</p>`; } // Gold resultsHTML += `<h4>Best Gold Cap Result:</h4>`; if (bestGoldKey) { let rankData = ranks[bestGoldKey]; let level = bestGoldKey.split('.')[1]; resultsHTML += ` <p>Rank: <b class="best-rank">#${bestGoldRank}</b> / ${totalRanks}</p><p>IVs: <b>${bestGoldIVs}</b> (Lvl ${level})</p><p>Stats: ${rankData[1].toFixed(2)} Atk / ${rankData[2].toFixed(2)} Def / ${rankData[3]} HP</p> `; } else { resultsHTML += `<p>No valid rank found (Pokémon may be too high CP for this league).</p>`; } resultsHTML += `</div>`; } // --- 6. Show Results --- document.getElementById('feedback').innerHTML = ""; // Clear "Calculating..." document.getElementById('results').innerHTML = resultsHTML; }, 50); // 50ms timeout to allow UI to update } </script></body></html>
