: 150px; } #analyzerBox input[type=number] { width: 50px; } #analyzerBox input[id=pokeList] { width: 150px; } #goButton { background-color: var(--navActive); color: var(--navActiveText); border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; margin-top: 15px; } #goButton:hover { opacity: 0.8; } #results .league-result { border: 1px solid var(--tableDividers); border-radius: 5px; padding: 10px; margin-bottom: 15px; background-color: var(--textBoxBg); } #results h3 { margin-top: 0; border-bottom: 2px solid var(--navActive); padding-bottom: 5px; } #results .best-rank { color: var(--goodResult); font-weight: bold; } #results .original-rank { font-size: 0.9em; opacity: 0.8; } </style></head><body><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TDF58VB" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript><header><ul class="header"><li class="dropdown active left"><a href="javascript:void(0)" class="dropbtn active">PvP IVs</a><div class="dropdown-content"><a href="/">Rankings (Single)</a><a href="/indexTest.html">Rankings (Beta)</a><a href="/leagueRanks.html">Rankings (League)</a><a href="/searchStr.html">Search Strings</a><a href="/calculator.html">Calculator</a><a href="/bottlecap.html" class="active">Bottle Cap Analyzer</a></div></li><li class="dropdown left"><a href="javascript:void(0)" class="dropbtn">Typing</a><div class="dropdown-content"><a href="/typeLookup.html">Chart</a><a href="/typeQuiz.html">Quiz</a></div></li><li class="flat right"><div class="theme-toggle-div"><img id="theme-toggle-icon" src="https://pvpivs.com/includes/sun.svg" aria-label="Change to light theme" alt="Sun icon" width="22" height="22"></div></li><li class="dropdown right"><a href="javascript:void(0)" class="dropburger"><div class="container"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></a><div class="dropdown-content dropdown-content-right"><a href="/about.html">About PvP IVs</a><a href="/contribute.html">Contribute</a><a href="/contact.html">Contact Us</a><a href="/privacy.html">Privacy Policy</a><a href="/cookies.html">Cookie Policy</a></div></li></ul></header><br /><section id="analyzerBox"><h2>Bottle Cap Analyzer</h2><p>Find the best IVs for a Pokémon by simulating a Silver or Gold Bottle Cap.</p><div><label for="capMode">1. Bottle Cap Mode:</label><select id="capMode"><option value="silver" selected>Silver Bottle Cap</option><option value="gold">Gold Bottle Cap</option></select></div><div><label for="pokeList">2. Pokémon:</label><input id="pokeList" onfocus="this.value=''" placeholder="e.g. Snorlax"/></div><div><label>3. Current IVs (Floor):</label><input type="number" id="floorA" value="2" min="0" max="15" title="Current Attack IV"> / <input type="number" id="floorD" value="5" min="0" max="15" title="Current Defense IV"> / <input type="number" id="floorS" value="7" min="0" max="15" title="Current Stamina IV"></div><div><button id="goButton" onclick="analyzeBottleCaps()">4. Analyze</button></div><div id="feedback" style="margin-top: 15px;"></div><div id="results" style="margin-top: 15px;"></div></section><script async defer src="https://pvpivs.com/includes/darkLightThemes.js"></script><script src="https://pvpivs.com/includes/calculate.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/awesomplete/1.1.5/awesomplete.min.js"></script><script src="https://pvpivs.com/includes/pokeListObj.js"></script><script> var inputMon = ""; // Store selected Pokémon // Initialize Awesomplete (function() { var input = document.getElementById("pokeList"); var monNames = Object.keys(pokeListObj); if (monNames.length < 1000) { console.error("pokeListObj not loaded!"); document.getElementById('feedback').innerHTML = "<p><i>ERROR: Failed to load Pokémon list. Please refresh.</i></p>"; } else { new Awesomplete(input, {list: monNames}); Awesomplete.$.bind(input, { "awesomplete-selectcomplete": function(evt) { inputMon = evt.text.label; } }); // Also handle manual input input.addEventListener('input', function() { if (monNames.includes(this.value)) { inputMon = this.value; } else { inputMon = ""; // Clear if not a valid mon } }); } })(); /** * Main analysis function */ async function analyzeBottleCaps() { // Clear previous results document.getElementById('feedback').innerHTML = "<i>Calculating...</i>"; document.getElementById('results').innerHTML = ""; // --- 1. Get User Inputs --- let capMode = document.getElementById('capMode').value; let floorA = parseInt(document.getElementById('floorA').value); let floorD = parseInt(document.getElementById('floorD').value); let floorS = parseInt(document.getElementById('floorS').value); if (inputMon === "" || !pokeListObj[inputMon]) { document.getElementById('feedback').innerHTML = "<p style='color: var(--badResult);'>Please select a valid Pokémon.</p>"; return; } if (isNaN(floorA) || isNaN(floorD) || isNaN(floorS)) { document.getElementById('feedback').innerHTML = "<p style='color: var(--badResult);'>Please enter valid current IVs.</p>"; return; } let baseStats = pokeListObj[inputMon].split(','); let bAtk = parseInt(baseStats[1]); let bDef = parseInt(baseStats[2]); let bSta = parseInt(baseStats[3]); let leagues = [ { name: "Little League", cp: 500 }, { name: "Great League", cp: 1500 }, { name: "Ultra League", cp: 2500 }, { name: "Master League", cp: "ML" } ]; let resultsHTML = ""; // --- 2. Loop through each league --- for (let league of leagues) { // Get the full ranking data for this Pokémon and league // We use floor 0 to get all 4096 combos let ranks = calculate(bAtk, bDef, bSta, 0, 1, 51, false, league.cp, inputMon); let keys = Object.keys(ranks); // keys are "StatProd.Lvl.A.D.S" let bestLeagueRank = 4097; let bestLeagueIVs = ""; let bestLeagueKey = ""; let originalRank = 4097; // Find the original rank let originalIVSuffix = `.${floorA}.${floorD}.${floorS}`; let originalKey = keys.find(k => k.endsWith(originalIVSuffix)); if (originalKey) { originalRank = ranks[originalKey][0]; } // --- 3. Find Combos to Test --- let combosToTest = new Set(); if (capMode === "gold") { // Gold Cap is easy, just test 15/15/15 combosToTest.add("15.15.15"); } else { // Silver Cap logic // Add the original IVs as the baseline combosToTest.add(`${floorA}.${floorD}.${floorS}`); // 1. Attack Capped (from floorA+1 to 15) for (let a = floorA + 1; a <= 15; a++) { combosToTest.add(`${a}.${floorD}.${floorS}`); } // 2. Defense Capped (from floorD+1 to 15) for (let d = floorD + 1; d <= 15; d++) { combosToTest.add(`${floorA}.${d}.${floorS}`); } // 3. Stamina Capped (from floorS+1 to 15) for (let s = floorS + 1; s <= 15; s++) { combosToTest.add(`${floorA}.${floorD}.${s}`); } } // --- 4. Test all combos and find the best --- for (let combo of combosToTest) { let ivSuffix = "." + combo; // e.g., ".2.15.7" // Find the key in the ranks object let rankKey = keys.find(k => k.endsWith(ivSuffix)); if (rankKey) { let rankData = ranks[rankKey]; // [rank, Atk, Def, HP, %Perf, ...] let currentRank = rankData[0]; if (currentRank < bestLeagueRank) { bestLeagueRank = currentRank; bestLeagueIVs = combo.replace(/\./g, '/'); // "2/15/7" bestLeagueKey = rankKey; // "StatProd.Lvl.A.D.S" } } } // --- 5. Format Output for this League --- resultsHTML += `<div class="league-result"><h3>${league.name} (${league.cp} CP)</h3>`; if (bestLeagueRank <= 4096 && bestLeagueKey) { let rankData = ranks[bestLeagueKey]; let keyParts = bestLeagueKey.split('.'); let level = keyParts[1]; let totalRanks = ranks.numRanks; resultsHTML += ` <p>Best Rank: <b class="best-rank">#${bestLeagueRank}</b> / ${totalRanks}</p><p>IVs: <b>${bestLeagueIVs}</b> (Lvl ${level})</p><p>Stats: ${rankData[1].toFixed(2)} Atk / ${rankData[2].toFixed(2)} Def / ${rankData[3]} HP</p><p class="original-rank">Original Rank (with ${floorA}/${floorD}/${floorS}): #${originalRank}</p> `; } else { // This happens if the Pokémon (e.g., base IVs) is too strong for the league resultsHTML += `<p>No valid rank found. Pokémon may be too high CP for this league.</p>`; } resultsHTML += `</div>`; } // --- 6. Show Results --- document.getElementById('feedback').innerHTML = ""; // Clear "Calculating..." document.getElementById('results').innerHTML = resultsHTML; } </script></body></html>
